name: Finalize audited review data
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  materialize-reviewed-data:
    if: github.head_ref == 'review/pytorch-llm-audit-2026-10-15' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/pytorch-llm-audit-2026-10-15
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: deepml-live-definitions
          run-id: 38840690026
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/official-base
      - uses: actions/download-artifact@v4
        with:
          name: deepml-additional-definitions
          run-id: 38841178947
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/official-extra
      - name: Install CPU test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install -r requirements-review.txt
      - name: Preserve original sources and reconstruct pinned public snapshot
        run: |
          mkdir -p /tmp/original
          git archive c201923f74cd181fb16259ff2cf42754334bf2e3 | tar -x -C /tmp/original
          python audit/rebuild_metadata.py --root . --original /tmp/original --public /tmp/official-base --extra /tmp/official-extra
          python audit/check_nested_legacy.py --root . --original /tmp/original
      - name: Execute independent tests and historical regressions
        env:
          OMP_NUM_THREADS: '1'
        run: |
          python -m pytest tests -q --junitxml=audit/pytest_results.xml | tee audit/pytest_local.log
          INTERVIEW_ROOT="$PWD/archive" python -m pytest tests/test_interview_core.py -q -k 'not composed and not rotary_offset and not cross_entropy_sequence' --junitxml=audit/pytest_interview_original.xml > /tmp/historical-regressions.log || true
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for path,expected in [('audit/pytest_results.xml',(108,0,0)),('audit/pytest_interview_original.xml',(21,9,0))]:
              suites=list(ET.parse(path).getroot().iter('testsuite'))
              actual=tuple(sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors'))
              assert actual==expected, (path,actual,expected)
              print(path, actual)
          PY
      - name: Replay public examples and finalize canonical ID index
        env:
          OMP_NUM_THREADS: '1'
        run: |
          python audit/run_public_tests.py --source original --output audit/public_original.json
          python audit/run_public_tests.py --source verified --output audit/public_core.json
          python audit/rebuild_metadata.py --root . --public /tmp/official-base --finalize
          python audit/validate_manifest.py
      - name: Commit generated review data on the review branch only
        run: |
          test "$(git branch --show-current)" = 'review/pytorch-llm-audit-2026-10-15'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Archive historical sources and record executed audit results and official ID index'
            git push origin HEAD:review/pytorch-llm-audit-2026-10-15
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finalized-review-audit-results
          path: |
            audit/*.json
            audit/*.xml
            audit/*.log
            /tmp/historical-regressions.log
          retention-days: 30
