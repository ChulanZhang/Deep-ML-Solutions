name: PyTorch audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture remaining public problem definitions
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request, hashlib, datetime
          out=pathlib.Path('audit-output/problems'); out.mkdir(parents=True)
          records=[]
          for pid in (124,320,359,360,374,427,429,457):
              url='https://api.deep-ml.com/fetch-problem?problem_id='+str(pid)
              req=urllib.request.Request(url,headers={'User-Agent':'DeepML-Solutions-review/1.0'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=response.read()
              json.loads(data)
              (out/f'{pid}.json').write_bytes(data)
              records.append({'id':pid,'url':url,'sha256':hashlib.sha256(data).hexdigest()})
          (out.parent/'provenance-extra.json').write_text(json.dumps({'retrieved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'problems':records},indent=2))
          print('Retrieved',len(records),'additional public problem definitions.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deepml-additional-definitions
          path: audit-output/
          retention-days: 7
          if-no-files-found: error
